# docker compose up -d --build
# First boot prints the admin password / device key:  docker compose logs api | head -40
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: greenhouse
      POSTGRES_PASSWORD: ${DB_PASSWORD:-greenhouse}
      POSTGRES_DB: greenhouse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenhouse"]
      interval: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://greenhouse:${DB_PASSWORD:-greenhouse}@db:5432/greenhouse
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?set REFRESH_TOKEN_SECRET in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@greenhouse.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEVICE_API_KEY: ${DEVICE_API_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}

volumes:
  pgdata:
